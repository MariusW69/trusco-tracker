[package]
name = "trusco-tracker"
version = "0.1.0"
description = "TrusCo Tracker: records time per matter for legal billing"
edition = "2024"

[lib]
name = "trusco_tracker_lib"
crate-type = ["rlib"]

[dependencies]
chrono = "0.4.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.12.1", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-opener = "2.7.0"
tauri-plugin-single-instance = "2.5.2"
tracker-core = { version = "0.1.0", path = "../core" }

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
