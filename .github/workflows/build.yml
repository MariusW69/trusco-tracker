# Windows installers for TrusCo Tracker (.msi and setup .exe).
# Run it from the Actions tab ("Run workflow") or push a tag like v0.1.1.
# Every run uploads the installers as a downloadable artifact; tag runs also attach
# them to a draft GitHub release. macOS builds are signed and notarised locally with
# desktop/scripts/release-mac.sh.
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/src-tauri -> target
            desktop/core -> target

      - run: npm ci

      - name: Test tracker engine
        run: cargo test --manifest-path core/Cargo.toml

      - name: Build installers
        run: npx tauri build --bundles msi,nsis

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: TrusCo-Tracker-Windows
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Attach to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: TrusCo Tracker ${{ github.ref_name }}
          files: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
